<style>

.start-btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:290px;padding:17px 20px;border:1.5px solid rgba(108,229,255,.9);border-radius:999px;background:linear-gradient(135deg,rgba(108,229,255,.95),rgba(76,232,184,.9));color:#04101c;font:700 14px 'JetBrains Mono',monospace;letter-spacing:.3em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 28px rgba(108,229,255,.5),inset 0 1px 0 rgba(255,255,255,.6);animation:btnGlow 2.4s ease-in-out infinite}
.start-btn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
.start-btn i{font-style:normal;display:inline-block;animation:nudge 1.2s ease-in-out infinite}
.start-btn:active{transform:scale(.96)}
@keyframes shine{0%{left:-60%}55%,100%{left:130%}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
@keyframes btnGlow{0%,100%{box-shadow:0 0 18px rgba(108,229,255,.4),inset 0 1px 0 rgba(255,255,255,.6)}50%{box-shadow:0 0 40px rgba(108,229,255,.85),inset 0 1px 0 rgba(255,255,255,.6)}}
.best{margin-top:16px;font:600 10px 'JetBrains Mono',monospace;letter-spacing:.24em;color:rgba(238,244,251,.5)}
@media(prefers-reduced-motion:reduce){.logo *,.game-sub,.start-btn,.start-btn::after,.start-btn i,.hero{animation:none!important}}
#fl{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .4s;z-index:19}
</style>
</head>

(()=>{
['contextmenu','selectstart','dragstart'].forEach(ev=>addEventListener(ev,e=>e.preventDefault(),{passive:false}));

const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*clamp(t,0,1),pad=n=>String(Math.floor(n)).padStart(5,'0');
const W=7,H=9,LIM=5.6,C3=BABYLON.Color3,C4=BABYLON.Color4,V3=BABYLON.Vector3;
const cv=$('c');

/* ===== SAVE ===== */
const SKEY='voidMonolithV2';
const S={score:0,best:0,planet:0,visited:false,lastReplay:null};
try{const d=JSON.parse(localStorage.getItem(SKEY)||'null');if(d){S.score=d.score||0;S.best=d.best||0;S.planet=d.planet||0;S.visited=!!d.visited}}catch(e){}
function save(){try{localStorage.setItem(SKEY,JSON.stringify({score:Math.floor(S.score),best:Math.floor(S.best),planet:S.planet,visited:S.visited}))}catch(e){}}

/* ===== AUDIO ===== */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(f,d,type='sine',v=.06,to){
  const a=ac();if(!a)return;
  try{
    const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(to)o.frequency.exponentialRampToValueAtTime(Math.max(20,to),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
function chord(fs,d,v){fs.forEach((f,i)=>setTimeout(()=>beep(f,d,'triangle',v),i*70))}

const polyArea=pts=>{let a=0;for(let i=0;i<pts.length;i++){const[x1,y1]=pts[i],[x2,y2]=pts[(i+1)%pts.length];a+=x1*y2-x2*y1}return Math.abs(a)/2};
const polyCentroid=pts=>{let a=0,cx=0,cy=0;for(let i=0;i<pts.length;i++){const[x1,y1]=pts[i],[x2,y2]=pts[(i+1)%pts.length],f=x1*y2-x2*y1;a+=f;cx+=(x1+x2)*f;cy+=(y1+y2)*f}a*=.5;return[cx/(6*a),cy/(6*a)]};
function clipHalf(pts,nx,ny,d){
  const out=[];
  for(let i=0;i<pts.length;i++){
    const A=pts[i],B_=pts[(i+1)%pts.length],da=nx*A[0]+ny*A[1]-d,db=nx*B_[0]+ny*B_[1]-d;
    if(da<=0)out.push(A);
    if((da<0&&db>0)||(da>0&&db<0)){const t=da/(da-db);out.push([A[0]+(B_[0]-A[0])*t,A[1]+(B_[1]-A[1])*t])}
  }
  return out;
}
function randomTiling(pts,n){
  let pieces=[pts];
  for(let g=0;pieces.length<n&&g<500;g++){
    pieces.sort((a,b)=>polyArea(b)-polyArea(a));
    const idx=Math.random()<.7?0:Math.floor(Math.random()*Math.min(2,pieces.length)),poly=pieces[idx],c=polyCentroid(poly);
    const ang=Math.random()*Math.PI,nx=Math.cos(ang),ny=Math.sin(ang);
    const d=nx*(c[0]+(Math.random()-.5)*30)+ny*(c[1]+(Math.random()-.5)*30);
    const A=clipHalf(poly,nx,ny,d),Bp=clipHalf(poly,-nx,-ny,-d);
    if(A.length<3||Bp.length<3||polyArea(A)<4200||polyArea(Bp)<4200)continue;
    pieces.splice(idx,1,A,Bp);
  }
  return pieces.length===n?pieces:null;
}

/* 5x5 laser router. 1 = "/" , 2 = "\", 9 = blocker, 8 = relay crystal (beam must pass through) */
function traceLaserGrid(it){
  const N=it.tData.size||5,pitch=90,half=40,gx0=75,gy0=320;
  let r=it.tData.startRow,c=0,dr=0,dc=1,steps=0;
  const path=[{x:42,y:gy0+r*pitch+half}],seen=new Set();
  while(r>=0&&r<N&&c>=0&&c<N&&steps<80){
    steps++;
    path.push({x:gx0+c*pitch+half,y:gy0+r*pitch+half});
    const v=it.gridState[r*N+c];
    if(v===9)return{path,hitTarget:false,seen};
    if(v===8)seen.add(r*N+c);
    if(v===1){const a=-dc,b=-dr;dr=a;dc=b}else if(v===2){const a=dc,b=dr;dr=a;dc=b}
    r+=dr;c+=dc;
  }
  let exit=false;
  if(c===N&&r===it.tData.targetRow&&dc===1){path.push({x:558,y:gy0+r*pitch+half});exit=true}
  else{const l=path[path.length-1];path.push({x:l.x+dc*36,y:l.y+dr*36})}
  let all=true;
  it.gridState.forEach((v,i)=>{if(v===8&&!seen.has(i))all=false});
  return{path,hitTarget:exit&&all,seen,exit};
}
function generateRandomLaserTask(){
  const N=5;
  for(let guard=0;guard<20000;guard++){
    const sol=Array(N*N).fill(0),vis=[];
    const startRow=Math.floor(Math.random()*N);
    let r=startRow,c=0,dr=0,dc=1,steps=0,bounces=0;
    while(r>=0&&r<N&&c>=0&&c<N&&steps<60){
      steps++;const idx=r*N+c;
      if(sol[idx]===0&&!vis.includes(idx)&&Math.random()<.5){sol[idx]=1+Math.floor(Math.random()*2);bounces++}
      if(!vis.includes(idx))vis.push(idx);
      const v=sol[idx];
      if(v===1){const a=-dc,b=-dr;dr=a;dc=b}else if(v===2){const a=dc,b=dr;dr=a;dc=b}
      r+=dr;c+=dc;
    }
    if(!(c===N&&dc===1&&r>=0&&r<N&&bounces>=5))continue;
    const straight=vis.filter(i=>sol[i]===0).sort(()=>Math.random()-.5);
    if(straight.length<2)continue;
    const crystals=straight.slice(0,2);
    const free=[];for(let i=0;i<N*N;i++)if(!vis.includes(i))free.push(i);
    free.sort(()=>Math.random()-.5);
    const blockers=free.slice(0,Math.min(4,free.length));
    const init=sol.map((v,i)=>{
      if(crystals.includes(i))return 8;
      if(blockers.includes(i))return 9;
      if(v)return(v+1+Math.floor(Math.random()*2))%3;
      return Math.random()<.35?1+Math.floor(Math.random()*2):0;
    });
    const task={name:'QUANTUM LASER ROUTER 5×5',size:N,startRow,targetRow:r,init};
    if(!traceLaserGrid({tData:task,gridState:init}).hitTarget)return task;
  }
  return{name:'QUANTUM LASER ROUTER 5×5',size:5,startRow:0,targetRow:0,init:Array(25).fill(0)};
}

  if(line)ctx.fillText(line.trim(),x,y);
  return y;
}

function completeTaskItem(it){
  if(it.collected)return;
  it.collected=true;
  if(focusedItem===it)focusedItem=null;
  if(activeDragItem===it){draggedPiece=null;activeDragItem=null}
  renderBillboardTaskTexture(it);

  chord([660,880,1180,1480],.28,.08);

  setTimeout(()=>{if(it.starMesh)it.starMesh.dispose();if(it.ped)it.ped.dispose();if(it.guiPlane)it.guiPlane.dispose()},320);
}

function pickTaskBoardUV(x,y){
  const pick=sc.pick(x,y,m=>m&&m.isEnabled()&&m.metadata&&m.metadata.cpItem);
  if(!pick||!pick.hit||!pick.pickedMesh)return null;
  const uv=pick.getTextureCoordinates();
  if(!uv)return null;
  return{it:pick.pickedMesh.metadata.cpItem,px:uv.x*600,py:(1-uv.y)*900};
}
function handleTaskPointerDown(x,y){
  const hit=pickTaskBoardUV(x,y);
  if(!hit)return false;
  const{it,px,py}=hit;
  if(it.collected||!it.taskActive)return false;
  focusedItem=it;
  if(it.tType==='mcq'){
    for(let idx=0;idx<4;idx++){
      const oy=330+idx*116;
      if(px>=38&&px<=562&&py>=oy&&py<=oy+94){
        if(idx===it.tData.ans){it.selectedOpt=idx;it.wrongOpt=null;it.flashErr=false;completeTaskItem(it)}
        else{
          it.wrongOpt=idx;it.flashErr=true;beep(190,.22,'sawtooth',.08,110);renderBillboardTaskTexture(it);
          setTimeout(()=>{if(!it.collected){it.flashErr=false;renderBillboardTaskTexture(it)}},450);
        }
        return true;
      }
    }
  }else if(it.tType==='shape'){
    for(let i=it.pieces.length-1;i>=0;i--){
      const p=it.pieces[i];
      if(polyHit(piecePoly(p),px,py)||Math.hypot(px-p.cx,py-p.cy)<26){
        it.pieces.splice(i,1);it.pieces.push(p);
        dragInfo={ox:p.cx,oy:p.cy,slot:p.slot,sx:px,sy:py,offx:px-p.cx,offy:py-p.cy,moved:false};
        p.slot=null;draggedPiece=p;activeDragItem=it;
        it.shapeFail=false;it.flashErr=false;
        renderBillboardTaskTexture(it);
        return true;
      }
    }
  }else if(it.tType==='laser'){
    const N=it.tData.size||5,pitch=90,boxSz=80,gx0=75,gy0=320;
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      const gx=gx0+c*pitch,gy=gy0+r*pitch;
      if(px>=gx&&px<=gx+boxSz&&py>=gy&&py<=gy+boxSz){
        const idx=r*N+c,v=it.gridState[idx];
        if(v===9||v===8){beep(180,.12,'sawtooth',.06,120);return true}
        it.gridState[idx]=(v+1)%3;
        beep(620+idx*24,.07,'triangle',.06,860);
        renderBillboardTaskTexture(it);
        if(traceLaserGrid(it).hitTarget)completeTaskItem(it);
        return true;
      }
    }
  }
  return true;
}
function handleTaskPointerMove(x,y){
  if(!draggedPiece||!activeDragItem||!dragInfo)return false;
  const hit=pickTaskBoardUV(x,y);
  if(hit&&hit.it===activeDragItem){
    if(Math.hypot(hit.px-dragInfo.sx,hit.py-dragInfo.sy)>10)dragInfo.moved=true;
    draggedPiece.cx=clamp(hit.px-dragInfo.offx,60,540);
    draggedPiece.cy=clamp(hit.py-dragInfo.offy,230,770);
    renderBillboardTaskTexture(activeDragItem);
  }
  return true;
}
function handleTaskPointerUp(){
  if(!draggedPiece||!activeDragItem||!dragInfo)return;
  const it=activeDragItem,p=draggedPiece,d=dragInfo;
  draggedPiece=null;activeDragItem=null;dragInfo=null;
  if(!d.moved){
    p.rot=(p.rot+1)%4;p.cx=d.ox;p.cy=d.oy;p.slot=d.slot;
    beep(480,.04,'sine',.04);
  }else{
    let best=-1,bd=1e9;
    it.slots.forEach((sl_,k)=>{const dd=Math.hypot(p.cx-sl_.x,p.cy-sl_.y);if(dd<bd){bd=dd;best=k}});
    if(bd<75){
      const occ=it.pieces.find(q=>q!==p&&q.slot===best);
      if(occ){
        if(d.slot!==null){occ.slot=d.slot;occ.cx=it.slots[d.slot].x;occ.cy=it.slots[d.slot].y}
        else{occ.slot=null;occ.cx=d.ox;occ.cy=d.oy}
      }
      p.slot=best;p.cx=it.slots[best].x;p.cy=it.slots[best].y;
    }else p.slot=null;
    beep(520,.04,'sine',.04);
  }
  renderBillboardTaskTexture(it);
  checkShape(it);
}

  brakeTimer=2.8;$('brake-btn').classList.add('on');beep(280,.18,'sine',.06,150);toast('AIRBRAKE ACTIVE · SPEED REDUCED');
}
function enterCheckpoint(pIdx){
  S.planet=pIdx;save();
  curW=pIdx;state='checkpoint';brakeTimer=0;manualCamTimer=0;crashedMenu=false;
  cpCamAlpha=-Math.PI/2;cpCamBeta=1.14;cpCamRadius=innerHeight>innerWidth?14.2:11.8;camSnap=true;
  Object.assign(P,{x:0,tx:0,vx:0,z:-7.5,jy:0,vy:0,g:true,sl:0,cy:1.25,yaw:0,step:0});

function launchIntoRouteFromGate(){
  state='play';
  $('cp-ui').style.display='none';$('story-whisper').style.opacity=0;$('brake-btn').style.display='flex';
  P.tx=clamp(P.x,-LIM,LIM);P.yaw=0;P.jy=0;P.vy=0;P.g=true;P.sl=0;
  activePW={type:null,t:0};brakeTimer=0;replayFrames=[];
  orbCount=0;savedDone=false;updateSaveUI();$('save-status').style.display='block';
  chord([520,780,1040],.3,.07);toast(`${PLANETS[curW].code} ROUTE ENGAGED`);
}

function stepCheckpoint(dt){
  if(K.ArrowLeft||K.KeyA)cpCamAlpha+=dt*1.6;
  if(K.ArrowRight||K.KeyD)cpCamAlpha-=dt*1.6;
  const fx=-Math.cos(cpCamAlpha),fz=-Math.sin(cpCamAlpha);
  let dy=Math.atan2(fx,fz)-P.yaw;
  while(dy>Math.PI)dy-=Math.PI*2;while(dy<-Math.PI)dy+=Math.PI*2;
  P.yaw+=dy*Math.min(1,dt*10);
  P.vx=clamp(-dy*5,-6,6);
  if((fwdHeld||K.KeyW||K.ArrowUp)&&!draggedPiece){
    P.x+=fx*12.5*dt;P.z+=fz*12.5*dt;
    if(gateOpen&&Math.abs(P.x)<3.6&&P.z-CPZ>=16.5-1.2){launchIntoRouteFromGate();return}
    const lz=P.z-CPZ,r=Math.hypot(P.x,lz),maxR=PLATFORM_R-1.3;
    if(r>maxR){P.x=P.x/r*maxR;P.z=CPZ+lz/r*maxR}
    if(!gateOpen&&P.z-CPZ>16.5-2.2&&Math.abs(P.x)<4.5)P.z=CPZ+16.5-2.2;
  }
  P.cy=1.25+Math.sin(performance.now()*.005)*.08;

  let remaining=0;
  for(const it of cpItems){
    if(it.collected)continue;
    remaining++;
    it.starMesh.rotation.y+=dt*2.4;
    it.starMesh.position.y=1.45+Math.sin(performance.now()*.004+it.id)*.16;
    const dist=Math.hypot(P.x-it.x,P.z-it.z);
    if(dist<3.2){
      if(!it.taskActive){
        it.taskActive=true;it.guiPlane.setEnabled(true);focusedItem=it;
        cpCamAlpha=Math.atan2(P.z-it.z,P.x-it.x);
        renderBillboardTaskTexture(it);beep(620,.1,'sine',.06,880);
        toast(`TASK 0${it.id+1} UNLOCKED`);
      }
      if(dist<1.35&&dist>.01){P.x=it.x+(P.x-it.x)/dist*1.35;P.z=it.z+(P.z-it.z)/dist*1.35}
    }else if(it.taskActive&&dist>5.4){
      it.taskActive=false;it.guiPlane.setEnabled(false);
      if(focusedItem===it)focusedItem=null;
      if(activeDragItem===it){draggedPiece=null;activeDragItem=null}
    }
  }
  if(remaining===0&&!gateOpen){
    gateOpen=true;if(gateBarrierGlow)gateBarrierGlow.setEnabled(false);
    chord([440,660,880,1100],.35,.08);toast('ALL 3 TASKS COMPLETE · NORTH GATE OPEN!');
  }
  if(gateOpen&&gateLeftDoor&&gateRightDoor){
    gateLeftDoor.position.x=lerp(gateLeftDoor.position.x,-6.8,dt*4);
    gateRightDoor.position.x=lerp(gateRightDoor.position.x,6.8,dt*4);
  }
}

const hitBox=()=>{const h=(P.sl>0&&P.g)?.35:.7;return{x0:P.x-.46,x1:P.x+.46,y0:P.cy-h,y1:P.cy+h,z0:P.z-.35-(P.step||0),z1:P.z+.46}};

function stepPlay(dt){
  const pl=PLANETS[curW];
  if(activePW.t>0){activePW.t=Math.max(0,activePW.t-dt);if(activePW.t<=0)activePW.type=null}
  if(brakeTimer>0){
    brakeTimer=Math.max(0,brakeTimer-dt);$('brake-sub').textContent=brakeTimer.toFixed(1)+'S';
    if(brakeTimer<=0){$('brake-btn').classList.remove('on');$('brake-sub').textContent='READY'}
  }
  const sp=pl.speed*(activePW.type==='BOOST'?1.42:1)*(brakeTimer>0?.48:1);
  P.z+=sp*dt;P.step=sp*dt;

  const dir=(K.ArrowRight||K.KeyD?1:0)-(K.ArrowLeft||K.KeyA?1:0);
  if(dir)P.tx=clamp(P.tx+dir*dt*28,-LIM,LIM);
  const nx=P.x+(P.tx-P.x)*Math.min(1,dt*14);
  P.vx=(nx-P.x)/dt;P.x=nx;P.yaw=0;

  jb=Math.max(0,jb-dt);
  if(jb>0&&P.g){P.vy=14.5;P.g=false;jb=0;beep(400,.14,'triangle',.05,800)}
  if(!P.g){P.jy+=P.vy*dt;P.vy-=36*dt;if(P.jy<=0){P.jy=0;P.vy=0;P.g=true}}
  P.sl=Math.max(0,P.sl-dt);
  const cr=P.sl>0&&P.g;
  P.cy+=((cr?.72:1.35)+P.jy-P.cy)*Math.min(1,dt*18);

  S.score+=sp*dt*.5;if(S.score>S.best)S.best=Math.floor(S.score);
  $('score-box').textContent=pad(S.score);
  $('bar').style.width=clamp((P.z-ROUTE_START_Z)/Math.max(1,finishZ-ROUTE_START_Z)*100,0,100)+'%';

  replayFrames.push({x:P.x,y:P.cy,z:P.z,vx:P.vx,sl:P.sl,g:P.g});
  if(replayFrames.length>3600)replayFrames.shift();

  wt+=dt*(activePW.type==='SLOW'?.38:1);
  feed();
  while(segs.length&&segs[0].z1<P.z-35)segs.shift().m.forEach(x=>x.dispose());

  const b=hitBox(),magRange=activePW.type==='MAGNET'?6.5:1.55;
  for(const s of segs){
    if(s.z0>P.z+340)break;
    for(const d of s.dy){
      const o=Math.sin(wt*d.sp+d.ph)*d.amp,cx=d.ax==='x'?d.x+o:d.x,cy=d.ax==='y'?d.y+o:d.y,a=d.a;
      d.b.position.set(cx,cy,d.z);
      a.x0=cx-d.w/2;a.x1=cx+d.w/2;a.y0=cy-d.h/2;a.y1=cy+d.h/2;
    }
    for(const c of s.co){
      if(c.t)continue;
      c.m.rotation.y+=dt*2.6;
      const dx=P.x-c.x,dy=P.cy-c.y,dz=P.z-c.z,dist=Math.hypot(dx,dy,dz);
      if(dist<magRange&&dist>1.2){c.x+=dx*dt*9;c.y+=dy*dt*9;c.z+=dz*dt*9;c.m.position.set(c.x,c.y,c.z)}
      if(Math.abs(P.x-c.x)<1.45&&Math.abs(P.cy-c.y)<1.75&&Math.abs(P.z-c.z)<1.5+(P.step||0)){
        c.t=1;c.m.dispose();
        if(c.kind==='SHARD'){S.score+=50;collectOrb();beep(780,.1,'triangle',.06,1280);triggerBurst(c.x,c.y,c.z,new C4(.4,.95,1,1),20)}
        else{activePW={type:c.pType,t:6.5};chord([580,860,1160],.22,.07);triggerBurst(c.x,c.y,c.z,new C4(1,.85,.3,1),28);toast(`${c.pType} ENGAGED`)}
      }
    }
    if(s.z0<P.z+2&&s.z1>P.z-2){
      for(const a of s.ob){
        if(b.x1>a.x0&&b.x0<a.x1&&b.y1>a.y0&&b.y0<a.y1&&b.z1>a.z0&&b.z0<a.z1){
          if(activePW.type==='PHASE'||activePW.type==='BOOST')continue;
          if(activePW.type==='SHIELD'){activePW={type:null,t:0};a.y0=-999;a.y1=-998;beep(340,.22,'sawtooth',.09,640);flash('#6ce5ff',.3);continue}
          onCrash();return;
        }
      }
    }
  }
  if(P.z>=finishZ)completeTour();
}
function onCrash(){
  if(replayFrames.length>20)S.lastReplay=replayFrames.slice();
  save();
  beep(115,.45,'sawtooth',.16,28);flash('#ff3b5c',.55);
  triggerBurst(P.x,P.cy,P.z,new C4(1,.25,.3,1),50);
  resumeRestartUI(true);
}
function completeTour(){
  if(replayFrames.length>20)S.lastReplay=replayFrames.slice();
  const nx=PLANETS[cpPlanet];
  state='arrive';brakeTimer=0;
  $('brake-btn').style.display='none';$('brake-btn').classList.remove('on');$('brake-sub').textContent='READY';
  $('bar').style.width='100%';
  chord([523,659,784,1046],.4,.08);flash('#ffffff',.3);
  toast(`ENTERING SECTOR ${nx.id+1} · ${nx.name}`);
}
function stepArrive(dt){
  const rem=(CPZ-6)-P.z,v=clamp(rem*1.1,9,PLANETS[curW].speed);
  P.z+=v*dt;P.step=v*dt;
  const nx=P.x*(1-Math.min(1,dt*3));P.vx=(nx-P.x)/dt;P.x=nx;P.yaw=0;P.sl=0;
  if(!P.g){P.jy+=P.vy*dt;P.vy-=36*dt;if(P.jy<=0){P.jy=0;P.vy=0;P.g=true}}
  P.cy+=((1.35+P.jy)-P.cy)*Math.min(1,dt*10);
  S.score+=v*dt*.5;$('score-box').textContent=pad(S.score);
  if(rem<=.4)arriveCheckpoint();
}
function arriveCheckpoint(){
  curW=cpPlanet;S.planet=curW;S.lastReplay=null;replayFrames=[];save();
  state='checkpoint';crashedMenu=false;manualCamTimer=0;
  cpCamAlpha=-Math.PI/2;cpCamBeta=1.14;cpCamRadius=innerHeight>innerWidth?14.2:11.8;
  P.yaw=0;P.vx=0;P.x=0;P.vy=0;P.jy=0;P.g=true;P.cy=1.25;
  $('save-status').style.display='none';$('cp-ui').style.display='block';$('bar').style.width='0%';
  buildRoute(curW);
  showStoryWhisper(PLANETS[curW]);
  chord([440,660,880],.3,.07);
}

/* ===== REPLAY ===== */
function startReplay(){
  const frames=replayFrames.length>20?replayFrames:S.lastReplay;
  if(!frames||!frames.length){toast('NO FLIGHT RECORDED YET');return}
  state='replay';replayIdx=0;replaySpeed=1;
  document.querySelectorAll('.rp-btn').forEach(b=>b.classList.toggle('on',b.dataset.spd==='1'));
  $('ui').innerHTML='';$('cp-ui').style.display='none';$('brake-btn').style.display='none';$('replay-bar').style.display='flex';
  toast('REPLAY MODE · 1X');
}
function stopReplay(){$('replay-bar').style.display='none';resumeRestartUI(true)}
function stepReplay(dt){
  const frames=replayFrames.length>20?replayFrames:S.lastReplay;
  if(!frames||!frames.length){stopReplay();return}
  replayIdx+=replaySpeed*60*dt;if(replayIdx>=frames.length)replayIdx=0;
  const f=frames[Math.floor(replayIdx)];
  if(f){P.x=f.x;P.cy=f.y;P.z=f.z;P.vx=f.vx;P.sl=f.sl;P.g=f.g;P.yaw=0;
    $('bar').style.width=clamp((P.z-ROUTE_START_Z)/Math.max(1,finishZ-ROUTE_START_Z)*100,0,100)+'%'}
}
document.querySelectorAll('.rp-btn').forEach(btn=>btn.addEventListener('click',()=>{
  replaySpeed=Number(btn.dataset.spd)||1;
  document.querySelectorAll('.rp-btn').forEach(b=>b.classList.toggle('on',b===btn));
  beep(620,.07,'sine',.05);toast(`REPLAY · ${replaySpeed}X`);
}));
$('rp-close').addEventListener('click',()=>{beep(420,.08,'sine',.05);stopReplay()});

const fwdBtn=$('fwd-btn');
const endFwd=()=>{fwdHeld=false;fwdBtn.classList.remove('on')};
fwdBtn.addEventListener('pointerdown',e=>{e.stopPropagation();ac();fwdHeld=true;fwdBtn.classList.add('on');try{fwdBtn.setPointerCapture(e.pointerId)}catch(_){}});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>fwdBtn.addEventListener(ev,endFwd));
$('brake-btn').addEventListener('pointerdown',e=>{e.stopPropagation();triggerBrake()});

const slideReq=()=>{P.sl=.7;if(!P.g)P.vy=Math.min(P.vy,-16)};
addEventListener('keydown',e=>{
  ac();K[e.code]=1;
  if(e.code==='Escape'){
    if(state==='play'||state==='checkpoint')resumeRestartUI(false);
    else if(state==='resume_menu'&&!crashedMenu)resumeGame(pausedFrom);
  }
  if(state==='play'){
    if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')jb=.16;
    if((e.code==='ArrowDown'||e.code==='KeyS')&&!e.repeat)slideReq();
    if(e.code==='KeyB'||e.code==='ShiftLeft')triggerBrake();
  }
  if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();
});
addEventListener('keyup',e=>K[e.code]=0);

cv.addEventListener('pointerdown',e=>{
  ac();
  if(state==='checkpoint'){
    if(handleTaskPointerDown(e.clientX,e.clientY)){cv.setPointerCapture(e.pointerId);return}
    arcDrag={x:e.clientX,y:e.clientY,a:cpCamAlpha,b:cpCamBeta,id:e.pointerId};cv.setPointerCapture(e.pointerId);return;
  }
  if(state!=='play')return;
  pd={x:e.clientX,y:e.clientY,tx:P.tx};cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
  if(state==='checkpoint'){
    if(draggedPiece){handleTaskPointerMove(e.clientX,e.clientY);return}
    if(arcDrag&&arcDrag.id===e.pointerId){
      cpCamAlpha=arcDrag.a-(e.clientX-arcDrag.x)*.0075;
      cpCamBeta=clamp(arcDrag.b-(e.clientY-arcDrag.y)*.006,.65,1.42);
      manualCamTimer=2.2;return;
    }
  }
  if(!pd||state!=='play')return;
  P.tx=clamp(pd.tx+(e.clientX-pd.x)/innerWidth*W*2*1.25,-LIM,LIM);
  const dy=e.clientY-pd.y;
  if(dy<-38){jb=.16;pd.y=e.clientY}else if(dy>38){slideReq();pd.y=e.clientY}
});
const up=()=>{if(state==='checkpoint'&&draggedPiece)handleTaskPointerUp();arcDrag=null;pd=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('wheel',e=>{if(state==='checkpoint')cpCamRadius=clamp(cpCamRadius+e.deltaY*.01,8.5,22)},{passive:true});

function updateSaveUI(){
  const p=PLANETS[curW],n=p.need;
  $('ss-label').textContent=savedDone?`${p.name} SAVED ✓`:`${p.orbName} ${Math.min(orbCount,n)} / ${n}`;
  $('ss-fill').style.width=Math.min(100,orbCount/n*100)+'%';
  $('save-status').classList.toggle('done',savedDone);
  const m=$('ss-msg');m.style.display=savedDone?'block':'none';
  if(savedDone)m.textContent=`✓ You saved ${p.name}! Keep flying to the next checkpoint.`;
}
function confetti(){
  const c=document.createElement('canvas'),dpr=Math.min(devicePixelRatio||1,2);
  c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:23';
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;document.body.appendChild(c);
  const x=c.getContext('2d'),cols=['#4ce8b8','#6ce5ff','#ff9233','#ff75ad','#c299ff','#ffffff'];
  const ps=Array.from({length:120},()=>({x:Math.random()*c.width,y:-Math.random()*c.height*.5,vx:(Math.random()-.5)*2.5*dpr,vy:(2+Math.random()*4)*dpr,s:(6+Math.random()*7)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.3,col:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(now){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.col;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(now-t0<3200)requestAnimationFrame(f);else c.remove();
  })(t0);
}
function collectOrb(){
  orbCount++;
  if(!savedDone&&orbCount>=PLANETS[curW].need){
    savedDone=true;S.score+=500;confetti();chord([523,659,784,1046,1318],.45,.09);
  }
  updateSaveUI();
}

      ${!crashed?`<button class="btn p" data-act="resume">RESUME</button>`:''}
      <button class="btn ${crashed?'p':''}" data-act="restart">RESTART CHECKPOINT</button>
      ${hasReplay?`<button class="btn" data-act="replay">WATCH REPLAY (1X–4X)</button>`:''}
      <button class="btn" data-act="howto">HOW TO PLAY &amp; STORY</button>
    </div>`;
}
function resumeGame(prev){
  $('ui').innerHTML='';
  if(prev==='play'){state='play';$('brake-btn').style.display='flex'}
  else if(prev==='checkpoint'){state='checkpoint';$('cp-ui').style.display='block'}
  else enterCheckpoint(S.planet||0);
}
$('ui').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  ac();beep(540,.07,'sine',.05);
  const act=b.dataset.act;
  if(act==='start'){
    if(!S.visited){S.visited=true;save();howToPlayUI(false)}else enterCheckpoint(S.planet||0);
  }else if(act==='begin-tour')enterCheckpoint(S.planet||0);
  else if(act==='close-how'){
    if(pausedFrom==='play'||pausedFrom==='checkpoint')resumeRestartUI(false);
    else enterCheckpoint(S.planet||0);
  }
  else if(act==='resume')resumeGame(pausedFrom);
  else if(act==='restart')enterCheckpoint(S.planet||0);
  else if(act==='replay')startReplay();
  else if(act==='howto')howToPlayUI(true);
});
$('how-btn').addEventListener('click',()=>{beep(520,.07,'sine',.05);if(state==='play'||state==='checkpoint')howToPlayUI(true)});
$('pz-btn').addEventListener('click',()=>{beep(520,.07,'sine',.05);if(state==='play'||state==='checkpoint')resumeRestartUI(false)});

/* ===== VISUALS & LOOP ===== */
function visuals(dt){
  const w=PLANETS[curW];
  const isCP=(state==='checkpoint'||state==='first'||state==='howto'||(state==='resume_menu'&&pausedFrom!=='play'&&!crashedMenu));
  gp.position.set(0,9,isCP?CPZ+175:finishZ+85);gp.scaling.set(135,135,1);gp.rotation.z+=dt*.12;
  bodies.forEach(b=>{if(!isCP&&b.m.position.z<P.z-160)place(b,false)});
  dg.forEach(g=>{
    if(!isCP&&g.position.z<P.z-110){g.position.set((Math.random()-.5)*900,60+Math.random()*250,P.z+1300+Math.random()*700);g.scaling.setAll(150+Math.random()*150)}
    g.rotation.z+=dt*.03;
  });
  if(shown!==curW){shown=curW;document.documentElement.style.setProperty('--ac',w.ac);drawG(w.c)}
  C3.LerpToRef(sc.fogColor,w.fog,Math.min(1,dt*2.5),sc.fogColor);
  sc.clearColor.set(sc.fogColor.r,sc.fogColor.g,sc.fogColor.b,1);

  const bob=P.g?Math.sin(performance.now()*.006)*.04:0;
  ship.position.set(P.x,P.cy+bob,P.z);shadow.position.set(P.x,.04,P.z);shipLight.position.set(P.x,P.cy+1.8,P.z+.3);
  ship.rotation.y=P.yaw||0;
  ship.rotation.z+=(-P.vx*.026-ship.rotation.z)*Math.min(1,dt*10);
  ship.rotation.x=-P.vy*.02+.03;
  core.rotation.y+=dt*3.5;coreRing.rotation.z-=dt*4.5;
  const pulse=.88+Math.sin(performance.now()*.022)*.14;
  jetCone.scaling.set(pulse,1+Math.sin(performance.now()*.03)*.2,pulse);
  ship.scaling.y=(P.sl>0&&P.g)?.68:1;

  const portrait=innerHeight>innerWidth;
  const inCP=(state==='checkpoint'||state==='first'||state==='howto'||(state==='resume_menu'&&pausedFrom!=='play'&&!crashedMenu));
  if(inCP){
    const isTask=Boolean(focusedItem&&focusedItem.taskActive&&!focusedItem.collected);
    const lookX=isTask?focusedItem.x:(P.x+Math.sin(P.yaw)*2.2);
    const lookY=isTask?4.9:1.65;
    const lookZ=isTask?focusedItem.z:(P.z+Math.cos(P.yaw)*2.2);
    const pivotX=isTask?focusedItem.x:P.x,pivotZ=isTask?focusedItem.z:P.z;
    const rad=isTask?(portrait?13.2:10.6):cpCamRadius;
    const dx=pivotX+rad*Math.sin(cpCamBeta)*Math.cos(cpCamAlpha);
    const dy=lookY+rad*Math.cos(cpCamBeta);
    const dz=pivotZ+rad*Math.sin(cpCamBeta)*Math.sin(cpCamAlpha);
    if(camSnap){cam.position.set(dx,dy,dz);camLook.set(lookX,lookY,lookZ);camSnap=false}
    else{
      cam.position.x=lerp(cam.position.x,dx,dt*8);cam.position.y=lerp(cam.position.y,dy,dt*8);cam.position.z=lerp(cam.position.z,dz,dt*8);
      camLook.x=lerp(camLook.x,lookX,dt*6);camLook.y=lerp(camLook.y,lookY,dt*6);camLook.z=lerp(camLook.z,lookZ,dt*6);
    }
    cam.setTarget(camLook);
    cam.fov=lerp(cam.fov,portrait?1.02:.86,dt*4);
  }else{
    cam.position.set(P.x*.7,(portrait?3.4:3)+P.jy*.4,P.z-(portrait?7.6:6));
    cam.rotation.set(.17,(P.x*.7-P.x)*.02,-ship.rotation.z*.15);camLook.set(cam.position.x,cam.position.y-1.2,cam.position.z+8);
    cam.fov+=((portrait?1.12:.9)+(activePW.type==='BOOST'?.15:.05)-cam.fov)*Math.min(1,dt*4);
  }
  for(const s of streaks){
    s.isVisible=!inCP;
    if(!inCP){
      if(s.position.z<P.z-5||s.position.z>P.z+130){s.position.z=P.z+20+Math.random()*110;s.position.x=(Math.random()-.5)*22;s.position.y=.5+Math.random()*11}
    }
  }
}

eng.runRenderLoop(()=>{
  const dt=Math.max(.001,Math.min(.05,eng.getDeltaTime()/1000));
  if(state==='first'||state==='howto'&&pausedFrom==='first'){
    const t=performance.now()*.0004;
    P.x=Math.cos(t)*5.2;P.z=Math.sin(t)*5.2-2;P.yaw=Math.atan2(-Math.sin(t),Math.cos(t));P.cy=1.3+Math.sin(t*4)*.1;cpCamAlpha+=dt*.18;
  }else if(state==='checkpoint')stepCheckpoint(dt);
  else if(state==='play')stepPlay(dt);
  else if(state==='arrive')stepArrive(dt);
  else if(state==='replay')stepReplay(dt);
  visuals(dt);
  sc.render();
});
addEventListener('resize',()=>eng.resize());
firstScreenUI();
})();
</script>
</body>
</html>
